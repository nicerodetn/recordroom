<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="content">

<style>
    .action-buttons-container .btn {
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .action-buttons-container .btn:hover:not([disabled]) {
        transform: scale(1.15);
        box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    }
    .action-buttons-container .btn:active:not([disabled]) {
        transform: scale(0.95);
    }
    .staff-mgmt-table thead th {
        background-color: #f4f6f9;
        font-size: 12.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        color: #444;
        border-bottom: 2px solid #dee2e6;
        padding: 12px 14px;
    }
    .staff-mgmt-table tbody tr:hover {
        background-color: #f8f9fa;
    }
    .staff-mgmt-table td {
        vertical-align: middle;
        padding: 11px 14px;
        font-size: 13.5px;
    }
    .staff-num-badge {
        background: #e9ecef;
        color: #495057;
        border-radius: 20px;
        padding: 3px 10px;
        font-size: 12px;
        font-weight: 600;
    }
    .empty-state {
        text-align: center;
        padding: 40px 20px;
        color: #aaa;
    }
    .empty-state i { font-size: 36px; margin-bottom: 12px; display: block; }
</style>

<div class="my-5 px-3">

    <h3 style="font-size:32px;" class="text-center mb-4 b-latest-data">Staff Management</h3>

    <div class="row">

        <!-- LEFT: Create Form -->
        <div class="col-lg-4 mb-4">
            <div class="card">
                <div class="card-header dashboard-bgcolor b-db-color">
                    <h5 class="card-title mb-0"><i class="fas fa-plus-circle mr-2"></i>Add New Staff</h5>
                </div>
                <div class="card-body">
                    <form id="staffForm">

                        <div class="form-group">
                            <label class="font-weight-bold" style="font-size:13px;">Staff Name <span class="text-danger">*</span></label>
                            <input type="text"
                                   name="name"
                                   class="form-control"
                                   placeholder="e.g. Rajan Kumar"
                                   required />
                        </div>

                        <button type="submit" id="btnCreateStaff" class="btn btn-primary btn-block">
                            <i class="fas fa-plus mr-2"></i>Add Staff
                        </button>
                    </form>

                    <div class="alert alert-info mt-3 mb-0" style="font-size: 12.5px;">
                        <i class="fas fa-info-circle mr-1"></i>
                        Active staff appear automatically in the <strong>Record Room Dealing Hand Name</strong> dropdowns across the application.
                    </div>
                </div>
            </div>
        </div>

        <!-- RIGHT: Staff Table -->
        <div class="col-lg-8 mb-4">
            <div class="card">
                <div class="card-header dashboard-bgcolor b-db-color d-flex align-items-center justify-content-between">
                    <h5 class="card-title mb-0"><i class="fas fa-list-alt mr-2"></i>All Staff</h5>
                    <span class="badge badge-light text-dark"
                          style="font-size: 13px;"
                          th:text="${staffMembers.size()} + ' staff'"
                          id="staff-count-badge">0 staff</span>
                    <button class="btn btn-sm btn-light ml-auto"
                            id="btnRefreshStaff"
                            title="Refresh table"
                            data-toggle="tooltip"
                            data-placement="left">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                </div>
                <div class="card-body p-0">
                    <div id="staff-table-container">
                        <div th:fragment="staff-table">
                            <div th:if="${staffMembers.isEmpty()}" class="empty-state">
                                <i class="fas fa-folder-open"></i>
                                No staff yet. Add your first staff member using the form!
                            </div>
                            <div th:if="${!staffMembers.isEmpty()}" class="table-responsive">
                                <table class="table table-bordered table-striped staff-mgmt-table mb-0">
                                    <thead>
                                    <tr>
                                        <th style="width:60px;">#</th>
                                        <th>Staff Name</th>
                                        <th style="width:110px;">Status</th>
                                        <th class="text-center" style="width:130px;">Action</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="st, stat : ${staffMembers}">
                                        <td><span class="staff-num-badge" th:text="${stat.index + 1}">1</span></td>
                                        <td><strong th:text="${st.name}">Staff Name</strong></td>
                                        <td>
                                            <span th:if="${st.active}" class="badge badge-success">Active</span>
                                            <span th:unless="${st.active}" class="badge badge-secondary">Inactive</span>
                                        </td>
                                        <td class="text-center">
                                            <div class="btn-group action-buttons-container">
                                                <button class="btn btn-sm btn-primary btn-edit-staff"
                                                        th:data-id="${st.id}"
                                                        th:data-name="${st.name}"
                                                        title="Edit Staff">
                                                    <i class="fas fa-edit"></i>
                                                </button>
                                                <button class="btn btn-sm btn-toggle-staff"
                                                        th:classappend="${st.active} ? 'btn-outline-secondary' : 'btn-outline-success'"
                                                        th:data-id="${st.id}"
                                                        th:title="${st.active} ? 'Deactivate' : 'Activate'">
                                                    <i class="fas" th:classappend="${st.active} ? 'fa-user-slash' : 'fa-user-check'"></i>
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Edit Staff Modal -->
<div class="modal fade" id="staffEditModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content shadow-lg border-0 rounded-lg">
            <div class="modal-header bg-primary text-white border-bottom-0">
                <h5 class="modal-title"><i class="fas fa-edit mr-2"></i>Edit Staff</h5>
                <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <form id="staffEditForm">
                <div class="modal-body p-4">
                    <input type="hidden" id="editStaffId" name="id" />

                    <div class="form-group mb-0">
                        <label class="font-weight-bold" style="font-size:13px;">Staff Name <span class="text-danger">*</span></label>
                        <input type="text" id="editStaffName" name="name" class="form-control" required />
                    </div>
                </div>
                <div class="modal-footer border-top-0 d-flex justify-content-end">
                    <button type="button" class="btn btn-secondary px-4 mr-2" data-dismiss="modal">Cancel</button>
                    <button type="submit" id="btnSaveStaffEdit" class="btn btn-primary px-4">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // Init Bootstrap tooltip on refresh button
    $('[data-toggle="tooltip"]').tooltip();

    // Open Edit Modal
    $(document).off('click', '.btn-edit-staff').on('click', '.btn-edit-staff', function() {
        var id = $(this).data('id');
        var name = $(this).data('name');

        $('#editStaffId').val(id);
        $('#editStaffName').val(name);

        $('#staffEditModal').modal('show');
    });

    // Handle Edit Form Submit
    $(document).off('submit', '#staffEditForm').on('submit', '#staffEditForm', function(e) {
        e.preventDefault();
        var form = $(this);
        var btn = $('#btnSaveStaffEdit');
        btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin mr-2"></i>Saving...');

        $.ajax({
            url: '/record/staff/update',
            type: 'POST',
            data: form.serialize(),
            success: function() {
                $('#staffEditModal').modal('hide');
                reloadStaffTable(function() {
                    showStaffToast('Staff updated successfully!', 'success');
                });
                btn.prop('disabled', false).html('Save Changes');
            },
            error: function(xhr) {
                var msg = xhr.responseText || 'Error updating staff. Please try again.';
                showStaffToast(msg, 'danger');
                btn.prop('disabled', false).html('Save Changes');
            }
        });
    });

    // ── Form submit: create new staff ──────────────────────────
    $(document).off('submit', '#staffForm').on('submit', '#staffForm', function(e) {
        e.preventDefault();
        var form = $(this);
        var btn = $('#btnCreateStaff');
        btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin mr-2"></i>Adding...');

        $.ajax({
            url: '/record/staff/save',
            type: 'POST',
            data: form.serialize(),
            success: function() {
                reloadStaffTable(function() {
                    showStaffToast('Staff added successfully!', 'success');
                });
                form[0].reset();
                btn.prop('disabled', false).html('<i class="fas fa-plus mr-2"></i>Add Staff');
            },
            error: function() {
                showStaffToast('Error adding staff. Please try again.', 'danger');
                btn.prop('disabled', false).html('<i class="fas fa-plus mr-2"></i>Add Staff');
            }
        });
    });

    // ── Toggle active/inactive ─────────────────────────────────
    $(document).off('click', '.btn-toggle-staff').on('click', '.btn-toggle-staff', function() {
        var id = $(this).data('id');
        $.ajax({
            url: '/record/staff/toggle/' + id,
            type: 'POST',
            success: function() {
                reloadStaffTable(function() {
                    showStaffToast('Staff status updated!', 'success');
                });
            },
            error: function() {
                showStaffToast('Error updating staff status.', 'danger');
            }
        });
    });

    // ── Refresh button ────────────────────────────────────────────
    $(document).off('click', '#btnRefreshStaff').on('click', '#btnRefreshStaff', function() {
        var icon = $(this).find('i');
        icon.addClass('fa-spin');
        reloadStaffTable(function() {
            icon.removeClass('fa-spin');
        });
    });

    // ── Helper: reload the staff table fragment ─────────────────
    function reloadStaffTable(callback) {
        $.ajax({
            url: '/record/staff/staff_management',
            type: 'GET',
            success: function(html) {
                var doc = $($.parseHTML(html));
                var newTable = doc.find('#staff-table-container').html();
                if (newTable) {
                    $('#staff-table-container').html(newTable);
                    htmx.process(document.getElementById('staff-table-container'));
                }
                var newCount = doc.find('#staff-count-badge').text();
                if (newCount) {
                    $('#staff-count-badge').text(newCount);
                }
                if (typeof callback === 'function') callback();
            },
            error: function() {
                if (typeof callback === 'function') callback();
            }
        });
    }

    // ── Helper: show floating toast ───────────────────────────────
    function showStaffToast(message, type) {
        var bg = type === 'success' ? '#28a745' : '#dc3545';
        var icon = type === 'success' ? 'fa-check-circle' : 'fa-times-circle';
        var toast = $('<div>')
            .css({
                position: 'fixed', bottom: '30px', right: '30px',
                background: bg, color: '#fff',
                padding: '14px 22px', borderRadius: '8px',
                fontSize: '14px', fontWeight: '600',
                boxShadow: '0 6px 20px rgba(0,0,0,0.2)',
                zIndex: 9999, display: 'flex', alignItems: 'center', gap: '10px',
                opacity: 0
            })
            .html('<i class="fas ' + icon + '"></i> ' + message)
            .appendTo('body');
        toast.animate({ opacity: 1, bottom: '40px' }, 300);
        setTimeout(function() {
            toast.animate({ opacity: 0, bottom: '20px' }, 400, function() { toast.remove(); });
        }, 3000);
    }

</script>

</div>
</html>
