<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div id="b-homedb" th:fragment="searchrecord">
    <div class="my-5">
        <div class="container">
            <h3 style="font-size:32px;" class="text-center col-12 b-latest-data">File In ward Entry</h3>
            <div class="row">
                <div class="container-fluid add-form-list">
                    <div class="row">
                        <div class="col-sm-12">
                            <div class="card">
                                <div class="card-body">
                                    <script>
                                        // Auto-hide success message after 3 seconds
                                        setTimeout(() => {
                                            let msg = document.getElementById("successMsg");
                                            if (msg) {
                                                msg.classList.remove("show");
                                                msg.remove();
                                            }
                                        }, 3000);

                                        setTimeout(() => {
                                            let msg = document.getElementById("errorMsg");
                                            if (msg) {
                                                msg.classList.remove("show");
                                                msg.remove();
                                            }
                                        }, 5000);
                                    </script>
                                    <div th:if="${successMessage}"
                                         class="alert alert-success alert-dismissible fade show text-center"
                                         id="successMsg"
                                         role="alert"
                                         th:text="${successMessage}">
                                    </div>

                                    <div th:if="${errorMessage}"
                                         class="alert alert-danger alert-dismissible fade show text-center"
                                         id="errorMsg"
                                         role="alert"
                                         th:text="${errorMessage}">
                                    </div>


                                    <form hx-get="/record/callbook/searchForInWardEntry"
                                          hx-target="#b-homedb"
                                          hx-swap="outerHTML">

                                        <label class="form-label fw-bold">Search File</label>

                                        <div class="row g-2">
                                            <div class="col">
                                                <input type="text" name="call_book_no"
                                                       class="form-control"
                                                       placeholder="Enter Call Book Serial No..." required/>
                                            </div>
                                            <div class="col">
                                                <input type="text" name="call_book_year"
                                                       class="form-control"
                                                       placeholder="Enter Call Book Year..." required/>
                                            </div>
                                            <div class="col-auto">
                                                <button type="submit" class="btn btn-primary">
                                                    Search
                                                </button>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="b-homedb" th:fragment="insertform">
    <div class="my-5">
        <div class="container">
            <h3 style="font-size:32px;" class="text-center col-12 b-latest-data">Call Book In Ward Entry (New)</h3>
            <div class="row">
                <div class="container-fluid add-form-list">
                    <div class="row">
                        <div class="col-sm-12">
                            <div class="card">
                                <div class="card-body">
                                    <script>
                                        // Auto-hide success message after 3 seconds
                                        setTimeout(() => {
                                            let msg = document.getElementById("successMsgI");
                                            if (msg) {
                                                msg.classList.remove("show");
                                                msg.remove();
                                            }
                                        }, 3000);

                                        setTimeout(() => {
                                            let msg = document.getElementById("errorMsgI");
                                            if (msg) {
                                                msg.classList.remove("show");
                                                msg.remove();
                                            }
                                        }, 5000);
                                    </script>
                                    <div th:if="${successMessage}"
                                         class="alert alert-success alert-dismissible fade show text-center"
                                         id="successMsgI"
                                         role="alert"
                                         th:text="${successMessage}">
                                    </div>

                                    <div th:if="${errorMessage}"
                                         class="alert alert-danger alert-dismissible fade show text-center"
                                         id="errorMsgI"
                                         role="alert"
                                         th:text="${errorMessage}">
                                    </div>



                                    <form th:object="${callbook}" method="post"
                                          hx-post="/record/callbook/saveInWardEntry"
                                          hx-target="#b-homedb"
                                          hx-swap="outerHTML"
                                          class="row g-3 border p-3 rounded bg-light shadow-sm"
                                          id="recordForm">


                                        <!-- 1. New DR Serial No -->
                                        <label for="newDrSerialNo">1.Call Book Serial No:</label>
                                        <small th:if="${lastCallBookNo != null}" class="form-text text-muted d-block">Last Call Book Serial No used: <span th:text="${lastCallBookNo}"></span></small>
                                        <input type="number" th:field="*{call_book_no}" class="form-control"
                                               id="newDrSerialNo" required/><br/>

                                        <!-- 2. New DR Year -->
                                        <label for="newDrYear">2.Call Book Year:</label>
                                        <input type="number" th:field="*{new_dr_year}" class="form-control"
                                               id="newDrYear" required/><br/>

                                        <label for="rackNo">3. DR Serial No:</label>
                                        <input type="text" th:field="*{new_drSerialNo}" class="form-control"
                                               id="rackNo" required/><br/>

                                        <label for="duedate">4.Due Date</label>
                                        <input type="date" th:field="*{possible_out_date}" class="form-control"
                                               id="duedate" required/><br/>

                                        <label for="duedate">5.Handing Over Date</label>
                                        <input type="date" th:field="*{handing_date}" class="form-control"
                                               id="handingdate" required/><br/>



                                        <!-- 3a. Section Dealing Hand Name -->
                                        <div class="col-12">
                                            <label for="sectionHandName">6a) Section Dealing Hand Name:</label>
                                            <select th:field="*{sectionDealingHandName}" class="form-select"
                                                    id="sectionHandName"
                                                    onchange="document.getElementById('sectionHandPhone').value = this.options[this.selectedIndex].getAttribute('data-phone') || '';"
                                                    required>
                                                <option value="">-- Select Section - Dealing Hand --</option>
                                                <option th:each="sec : ${sections}"
                                                        th:value="${sec.sectionDealingHandName}"
                                                        th:text="${sec.section} + ' - ' + ${sec.sectionDealingHandName}"
                                                        th:data-phone="${sec.sectionDealingHandPhoneNo}"></option>
                                            </select>
                                        </div>

                                        <!-- 3b. Section Dealing Hand Phone No -->
                                        <div class="col-12">
                                            <label for="sectionHandPhone">6b) Section Dealing Hand Phone No:</label>
                                            <input type="text"  pattern="\d{10}"
                                                   maxlength="10"
                                                   minlength="10"
                                                   oninput="this.value = this.value.replace(/\D/g, '').slice(0, 10)" th:field="*{sectionDealingHandPhoneNo}" class="form-control"
                                                   id="sectionHandPhone" required/>
                                        </div>

                                        <!-- 4. Record Room Dealing Hand Name -->
                                        <div style="padding-top: 17px;" class="col-12">
                                            <label class="form-label fw-bold">7. Record Room Dealing Hand
                                                Name</label><br>
                                            <select class="form-select" th:field="*{recordRoomDealingHandName}"
                                                    required>
                                                <option value="">-- Select Name --</option>
                                                <option th:each="s : ${staffList}" th:value="${s}" th:text="${s}"></option>
                                                <option value="Old">Others</option>
                                            </select>
                                            <div class="invalid-feedback">
                                                Please select a name before saving.
                                            </div>
                                        </div>
                                        <br/>




                                        <!-- 5. Purpose of Incoming File -->
                                        <label for="purposeIncoming">8. Purpose of Incoming File:</label>
                                        <input type="text" th:field="*{purpose_Of_Incoming_File}" class="form-control"
                                               id="purposeIncoming" required/><br/>


                                        <!-- 6. Rack No -->
                                        <label for="rackNo">9. Rack No:</label>
                                        <input type="number" th:field="*{rack_no}" class="form-control"
                                               id="rackNo" required/>




                                        <div class="d-grid mt-4">
                                            <button type="submit" class="btn btn-primary btn-lg">💾 Save Record</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="b-homedb" th:fragment="updateform">
    <div class="my-5">
        <div class="container">
            <h3 style="font-size:32px;" class="text-center col-12 b-latest-data">Call Book In Ward Entry for Existing
                Record</h3>
            <div class="row">
                <div class="container-fluid add-form-list">
                    <div class="row">
                        <div class="col-sm-12">
                            <div class="card">
                                <div class="card-body">
                                    <div>
                                        <h3>File Details Found</h3>
                                        <p><strong>Distribution Register Serial No:</strong> <span
                                                th:text="${callbook.new_drSerialNo}"></span></p>
                                    </div>
                                    <form th:object="${callbook}" method="post"
                                          hx-post="/record/callbook/updateInWardEntry"
                                          hx-target="#b-homedb"
                                          hx-swap="outerHTML"
                                          class="row g-3 border p-3 rounded bg-light shadow-sm"
                                          id="recordForm1">


                                        <input type="hidden" th:field="*{id}" />

                                        <input type="hidden" th:field="*{new_drSerialNo}" />

                                        <input type="hidden" th:field="*{old_drSerialNo}" />
                                        <input type="hidden" th:field="*{old_dr_year}" />

                                        <input type="hidden" th:field="*{unique_key}" />

                                        <label for="callBookNoUpdate">1.Call Book Serial No:</label>
                                        <input type="number" th:field="*{call_book_no}" class="form-control"
                                               id="callBookNoUpdate" required/><br/>

                                        <label for="callBookYearUpdate">2.Call Book Year:</label>
                                        <input type="number" th:field="*{new_dr_year}" class="form-control"
                                               id="callBookYearUpdate" required/><br/>

                                        <label for="duedate">3.Due Date</label>
                                        <input type="date" th:field="*{possible_out_date}" class="form-control"
                                               id="duedate"/><br/>

                                        <!-- 1a. Section Dealing Hand Name -->
                                        <div class="col-12">
                                            <label for="sectionHandName">4a) Section Dealing Hand Name:</label>
                                            <select th:field="*{sectionDealingHandName}" class="form-select"
                                                    id="sectionHandName1"
                                                    onchange="document.getElementById('sectionHandPhone1').value = this.options[this.selectedIndex].getAttribute('data-phone') || '';">
                                                <option value="">-- Select Section - Dealing Hand --</option>
                                                <option th:each="sec : ${sections}"
                                                        th:value="${sec.sectionDealingHandName}"
                                                        th:text="${sec.section} + ' - ' + ${sec.sectionDealingHandName}"
                                                        th:data-phone="${sec.sectionDealingHandPhoneNo}"></option>
                                            </select>
                                        </div>

                                        <!-- 1b. Section Dealing Hand Phone No -->
                                        <div class="col-12">
                                            <label for="sectionHandPhone">4b) Section Dealing Hand Phone No:</label>
                                            <input type="text" th:field="*{sectionDealingHandPhoneNo}" class="form-control"
                                                   id="sectionHandPhone1"/>
                                        </div>

                                        <!-- 2. Record Room Dealing Hand Name -->
                                        <div style="padding-top: 17px;" class="col-12">
                                            <label class="form-label fw-bold">5. Record Room Dealing Hand
                                                Name</label><br>
                                            <select class="form-select" th:field="*{recordRoomDealingHandName}"
                                                    required>
                                                <option value="">-- Select Name --</option>
                                                <option th:each="s : ${staffList}" th:value="${s}" th:text="${s}"></option>
                                                <option value="Old">Others</option>
                                            </select>
                                            <div class="invalid-feedback">
                                                Please select a name before saving.
                                            </div>
                                        </div>
                                        <br/>


                                        <!-- 3. Purpose of Incoming File -->
                                        <label for="purposeIncoming">6. Purpose of Incoming File:</label>
                                        <input type="text" th:field="*{purpose_Of_Incoming_File}" class="form-control"
                                               id="purposeIncoming1"/><br/>


                                        <!-- 4. Rack No -->
                                        <label for="rackNo">7. Rack No:</label>
                                        <input type="number" th:field="*{rack_no}" class="form-control"
                                               id="rackNo1"/><br/>


                                        <div class="d-grid mt-4">
                                            <button type="submit" class="btn btn-primary btn-lg">💾 Save Record</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>


</html>
