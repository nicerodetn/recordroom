<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div id="b-homedb" th:fragment="tabler">
  <div class="my-5">


    <h3 style="font-size:32px;" class="text-center mb-3 b-latest-data">RTI Report</h3>

      <script>
          $(function () {
            $('#example1').DataTable({
                scrollX: true,
                dom: 'Bfrtip',
                buttons: [
                    {
                        extend: 'pdfHtml5',
                        orientation: 'landscape',
                        text: 'Export PDF',
                        className: 'btn btn-secondary mr-2',
                        filename: 'RTI_Report',
                        title: '',
                        customize: function (doc) {
                            doc.pageMargins = [40, 70, 40, 60];
                            doc.defaultStyle.fontSize = 10;
                            doc.content.unshift({
                                margin: [0, 0, 0, 12],
                                stack: [
                                    { text: 'Erode District Administration', fontSize: 16, bold: true, alignment: 'center' },
                                    { text: 'Record Room', fontSize: 11, alignment: 'center' },
                                    { text: 'RTI REPORT', fontSize: 13, bold: true, alignment: 'center', margin: [0, 6, 0, 0] },
                                    { text: 'Generated on: ' + new Date().toLocaleDateString(), fontSize: 9, alignment: 'center' }
                                ]
                            });
                            doc.styles.tableHeader = { fillColor: '#4CAF50', color: 'white', bold: true, alignment: 'center' };
                        },
                        exportOptions: { columns: ':visible' }
                    },
                    {
                        extend: 'excelHtml5',
                        text: 'Export Excel',
                        className: 'btn btn-secondary',
                        filename: 'RTI_Report',
                        title: '',
                        sheetName: 'Report',
                        customize: function (xlsx) {
                            var sheet = xlsx.xl.worksheets['sheet1.xml'];
                            var $sheet = $(sheet);
                            var styles = xlsx.xl['styles.xml'];
                            $(styles).find('xf').each(function () {
                                var xf = $(this);
                                if (xf.attr('xfId') === '0') {
                                    xf.attr('applyAlignment', '1');
                                    if (!xf.find('alignment').length) {
                                        xf.append('<alignment horizontal="center" vertical="center"/>');
                                    }
                                }
                            });
                            $('row', sheet).each(function () {
                                var r = parseInt($(this).attr('r'));
                                $(this).attr('r', r + 5);
                                $('c', this).each(function () {
                                    var ref = $(this).attr('r');
                                    var col = ref.replace(/[0-9]/g, '');
                                    $(this).attr('r', col + (r + 5));
                                });
                            });
                            var today = new Date().toLocaleDateString();
                            var sheetData = $('sheetData', sheet);
                            sheetData.prepend(
                                '<row r="1" ht="28" customHeight="1"><c r="A1" t="inlineStr" s="51"><is><t>Erode District Administration</t></is></c></row>' +
                                '<row r="2" ht="22" customHeight="1"><c r="A2" t="inlineStr" s="51"><is><t>Record Room</t></is></c></row>' +
                                '<row r="3" ht="20" customHeight="1"><c r="A3" t="inlineStr" s="51"><is><t>Generated on: ' + today + '</t></is></c></row>' +
                                '<row r="4" ht="26" customHeight="1"><c r="A4" t="inlineStr" s="51"><is><t>RTI REPORT</t></is></c></row>' +
                                '<row r="5"></row>'
                            );
                            var mergeCells = $sheet.find('mergeCells');
                            if (!mergeCells.length) {
                                mergeCells = $('<mergeCells count="0"/>');
                                $sheet.append(mergeCells);
                            }
                            mergeCells.append('<mergeCell ref="A1:M1"/>');
                            mergeCells.append('<mergeCell ref="A2:M2"/>');
                            mergeCells.append('<mergeCell ref="A3:M3"/>');
                            mergeCells.append('<mergeCell ref="A4:M4"/>');
                            var currentCount = parseFloat(mergeCells.attr('count')) || 0;
                            mergeCells.attr('count', currentCount + 4);
                            var colWidths = [];
                            $('row', sheet).each(function () {
                                var r = parseInt($(this).attr('r'));
                                if (r > 5) {
                                    $('c', this).each(function (i) {
                                        var text = $('t', this).text();
                                        var len = text ? text.length : 0;
                                        colWidths[i] = Math.max(colWidths[i] || 10, len);
                                    });
                                }
                            });
                            var colsXml = '<cols>';
                            colWidths.forEach(function (w, i) {
                                colsXml += '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + Math.min(w + 5, 50) + '"/>';
                            });
                            colsXml += '</cols>';
                            $sheet.find('worksheet').prepend(colsXml);
                        },
                        exportOptions: { columns: ':visible' }
                    }
                ]
            });
          });
      </script>

    <div class="container-fluid">
      <div class="row">
        <div class="col-12">
          <div class="card">
            <div class="card-header">
              <h3 class="card-title"></h3>
            </div>
            <!-- /.card-header -->
            <div class="card-body">
              <table id="example1" class="table table-bordered table-striped">
                <thead>
                <tr>
                  <th>Sr. No.</th>
                  <th>Petitioner Name</th>
                  <th>Petitioner Address</th>
                  <th>Petitioner Phone No</th>
                  <th>Letter No</th>
                  <th>Subject</th>
                  <th>RTI Date</th>
                  <th>In Time</th>
                  <th>Out Time</th>
                  <th>Check No</th>
                  <th>Amount</th>
                  <th>Record Room Dealing Hand Name</th>
                  <th>Remarks</th>
                  <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="record, iterStat : ${rti}">
                  <td th:text="${iterStat.index + 1}"></td>
                  <td th:text="${record.pettitioner_name}"></td>
                  <td th:text="${record.pettitioner_address}"></td>
                  <td th:text="${record.pettitioner_phoneno}"></td>
                  <td th:text="${record.letter_no}"></td>
                  <td th:text="${record.subject}"></td>
                  <td th:text="${#temporals.format(record.rtiDate, 'dd-MM-yyyy')}"></td>
                  <td th:text="${#temporals.format(record.in_time, 'HH:mm')}"></td>
                  <td th:text="${#temporals.format(record.out_time, 'HH:mm')}"></td>
                  <td th:text="${record.e_challan_no}"></td>
                  <td th:text="${record.amount}"></td>
                  <td th:text="${record.rr_dealing_name}"></td>
                  <td th:text="${record.remarks}"></td>
                  <td class="text-center align-middle">
                    <button class="btn btn-sm btn-danger btn-delete-record" 
                            th:data-id="${record.id}" 
                            title="Delete Record">
                        <i class="fas fa-trash"></i>
                    </button>
                  </td>
                </tr>
                </tbody>
              </table>

            </div>
            <!-- /.card-body -->
          </div>
          <!-- /.card -->
        </div>
        <!-- /.col -->
      </div>
      <!-- /.row -->
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteConfirmModal" tabindex="-1" role="dialog" aria-labelledby="deleteConfirmModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content shadow-lg border-0 rounded-lg">
                <div class="modal-header bg-danger text-white border-bottom-0">
                    <h5 class="modal-title" id="deleteConfirmModalLabel">Confirm Delete</h5>
                    <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body p-4 text-center">
                    <i class="fas fa-exclamation-triangle text-warning fa-3x mb-3"></i>
                    <p class="mb-0 font-weight-bold" style="font-size: 16px;">Are you sure you want to delete this record?</p>
                    <small class="text-muted">This action cannot be undone.</small>
                </div>
                <div class="modal-footer border-top-0 d-flex justify-content-center">
                    <button type="button" class="btn btn-secondary px-4 mr-2" data-dismiss="modal">Cancel</button>
                    <button type="button" id="btnConfirmDelete" class="btn btn-danger px-4">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        $(function () {
            var deleteRecordId = null;
            var deleteUrl = '/record/rti/delete/';

            $(document).off('click', '.btn-delete-record').on('click', '.btn-delete-record', function() {
                deleteRecordId = $(this).data('id');
                if (deleteRecordId) {
                    $('#deleteConfirmModal').modal('show');
                }
            });

            $(document).off('click', '#btnConfirmDelete').on('click', '#btnConfirmDelete', function() {
                if (deleteRecordId) {
                    $.ajax({
                        url: deleteUrl + deleteRecordId,
                        type: 'POST',
                        success: function(response) {
                            $('#deleteConfirmModal').modal('hide');
                            Swal.fire({
                                icon: 'success',
                                title: 'Deleted!',
                                text: 'Record deleted successfully.',
                                confirmButtonText: 'OK',
                                timer: 2000,
                                timerProgressBar: true
                            }).then((result) => {
                                htmx.ajax('GET', '/record/rti/rti_report', {target: '#b-homedb', swap: 'innerHTML'});
                            });
                        },
                        error: function(xhr) {
                            $('#deleteConfirmModal').modal('hide');
                            var errorMsg = xhr.responseText || 'Failed to delete record';
                            Swal.fire({
                                icon: 'error',
                                title: 'Error!',
                                text: errorMsg,
                                confirmButtonText: 'OK'
                            });
                        }
                    });
                }
            });
        });
    </script>

  </div>
</div>
</html>
